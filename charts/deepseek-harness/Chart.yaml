type: application
version: 0.1.21
appVersion: "0.2.1-alpha.3"
kubeVersion: ">=1.27.0-0"
home: https://github.com/runzhliu/deepseek-harness-docker
keywords:
  - deepseek
  - agent
  - harness
  - ai
maintainers:
  - name: runzhliu
    url: https://github.com/runzhliu
sources:
  - https://github.com/runzhliu/deepseek-harness-docker
